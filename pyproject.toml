[project]
name = "oc-top"
version = "0.1.0"
description = "A fast, interactive terminal dashboard (TUI) for visualizing OpenCode AI token usage and costs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tui", "cli", "opencode", "claude-code", "codex", "gemini", "llm", "tokens", "cost", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=1.0.0",
]

[project.scripts]
oc-top = "oc_top.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_top"]
